// Reconstructed from Neural DSP Cortex Control v4.0.1 binary
// Quad Cortex preset format - reverse engineered protobuf schema
syntax = "proto3";

message ParamValue {
  oneof value {
    int32 int_value = 1;
    float float_value = 2;
    string string_value = 3;
  }
}

message Param {
  optional int32 expression = 1;
  optional float expression_min = 2;
  optional float expression_max = 3;
  optional bool scene_mode = 4;
  repeated ParamValue param_values = 5;
  optional uint32 index = 6;
  optional bool is_led = 7;
  repeated string dynamic_steps = 8;
  repeated string dynamic_icons = 9;
  repeated string dynamic_metadata = 10;
}

message Expression {
  // Expression pedal assignment - fields TBD from traffic capture
}

message ExpressionBypassInfo {
  // Expression bypass info - fields TBD from traffic capture
}

message SceneBypass {
  bool bypass = 1;
}

message Model {
  optional uint32 hash = 1;         // Model ID hash - identifies the amp/effect/cab
  repeated Param params = 2;        // All parameters for this model
  repeated Expression bypass_expression = 3;
  repeated ExpressionBypassInfo expression_bypass_info = 4;
  optional uint32 column = 5;       // Column position in the grid (0-7)
  optional bool notify_flag = 6;
  optional bool sidechain_sink_flag = 7;
  optional bool sidechain_source_flag = 8;
}

message SplitControlPoints {
  int32 split = 1;
  int32 mix = 2;
}

message Chain {
  optional uint32 in_portid = 1;    // Input port ID
  optional uint32 out_portid = 2;   // Output port ID
  repeated Model models = 5;        // Models (blocks) in this chain
  repeated SplitControlPoints split_control_points = 6;
  repeated Model splitter = 7;
  repeated Model mixer = 8;
  repeated Model output_control = 9;
  repeated SceneBypass splitBypass = 10;
  repeated SceneBypass mixBypass = 11;
  repeated Model combined_splitter = 12;
  repeated Model input_control = 13;
  optional uint32 row = 14;         // Row in the grid (0-3)
}

message ColBypass {
  repeated SceneBypass sceneBypass = 1;  // Bypass state per scene
  optional uint32 column = 2;            // Column position
  optional bool sceneMode = 3;           // Whether scene mode is active
}

message Bypass {
  repeated ColBypass colBypass = 1;
  optional uint32 row = 2;
}

message MidiMessageInfo {
  // MIDI message configuration - fields TBD
}

message LegacyStompModeStompData {
  uint32 row = 1;
  uint32 column = 2;
}

message StompModeAssignment {
  uint32 row = 1;
  uint32 column = 2;
  uint32 stomp_index = 3;
}

message SlotNotification {
  // Model update notifications - fields TBD
}

message BinaryPreset {
  optional string name = 2;
  optional uint32 hash = 3;
  optional string date = 4;
  optional float volume = 5;
  optional float pan = 6;
  optional uint32 default_scene = 7;
  optional string author_name = 8;
  optional string author_id = 9;
  optional uint32 tempo = 10;
  repeated Chain chains = 11;            // The 4 rows of the signal chain grid
  repeated string tags = 12;
  repeated LegacyStompModeStompData legacy_stomp_mode_stomp_data = 13;
  repeated uint32 scene_tempo = 14;      // Per-scene tempo values
  repeated string scene_labels = 15;     // Scene A-H names
  repeated MidiMessageInfo midi_messages = 16;
  repeated MidiMessageInfo midi_messages_general = 17;
  repeated Bypass bypass = 18;           // Per-row bypass states
  repeated Model tempoProgramData = 19;
  repeated uint32 layout_code_1 = 20;
  repeated uint32 layout_code_2 = 21;
  repeated string created_version = 22;
  repeated string modified_version = 23;
  repeated string oldest_compatible_version = 24;
  repeated string cloud_id = 25;
  repeated string description = 26;
  repeated StompModeAssignment stomp_mode_assignments = 27;
  repeated SlotNotification model_update_notifications = 28;
  repeated uint32 recompile_code_1 = 29;
  repeated uint32 recompile_code_2 = 30;
  repeated uint32 scene_colors = 31;     // Per-scene color values
  map<uint32, string> stomp_labels = 32;
  repeated MidiMessageInfo midi_messages_general_v2 = 33;
  map<uint32, string> single_stomp_labels = 34;
  map<uint32, bool> stomp_is_momentary = 35;
  optional bool side_chain_follow_exists = 36;
  optional bool zsk_7182_applied = 37;
}
